plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }

android {
    namespace = 'wang.yaxin.box'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'wang.yaxin.box'
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        // libnode.so needs libc++_shared.so at runtime — build with the shared STL so
        // the NDK's libc++_shared.so is packaged into the APK.
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // nodejs-mobile JNI bridge (libnode.so per ABI in src/main/jniLibs, headers in cpp).
    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/jniLibs'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libnode.so', '**/libnative-lib.so']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation project(':catvod')   // real com.github.catvod.crawler.Spider runtime
    implementation libs.nanohttpd
    // Native player: the device WebView can be ancient (a Sony Walkman ships
    // Chromium 66) and its <video> can't decode many spider streams. Hand the
    // resolved URL + per-source headers to ExoPlayer (media3) instead, which
    // plays mp4/HLS/DASH with request headers the WebView never applies.
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // OkHttp-backed DataSource so a network interceptor can drop origin headers
    // (Referer/Cookie) when a link redirects to a different-host CDN — cloud/alist
    // sources 403 otherwise (the Referer is for the origin, not the CDN).
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    coreLibraryDesugaring libs.desugar
}
