plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }

android {
    namespace = 'wang.yaxin.box'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'wang.yaxin.box'
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures {
        buildConfig = true
    }

    // nodejs-mobile JNI bridge (libnode.so per ABI in src/main/jniLibs, headers in cpp).
    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/jniLibs'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libnode.so', '**/libnative-lib.so']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation project(':catvod')   // real com.github.catvod.crawler.Spider runtime
    implementation libs.nanohttpd
    coreLibraryDesugaring libs.desugar
}
